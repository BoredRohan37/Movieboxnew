name: Windows 8.1 x64 VLC build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/windows81.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 8.1-compatible x64 executable
    runs-on: windows-2022

    env:
      # Pentium E4400 supports the x86-64 baseline, but not newer
      # instruction sets such as SSSE3, SSE4, or AVX.
      RUSTFLAGS: "-C target-cpu=x86-64"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust nightly and rust-src
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default nightly
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build for Windows 7 baseline (Windows 8.1 compatible target)
        run: cargo +nightly build -Z build-std=std,panic_abort --target x86_64-win7-windows-msvc --release --locked

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "target\x86_64-win7-windows-msvc\release\moviebox-tui.exe"
          if (-not (Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Tui-Windows81-x64-VLC
          path: target/x86_64-win7-windows-msvc/release/moviebox-tui.exe
          if-no-files-found: error
          retention-days: 14
