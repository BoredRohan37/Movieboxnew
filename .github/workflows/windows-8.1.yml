
name: Windows 8.1 x64 VLC build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      RUSTFLAGS: "-C target-cpu=x86-64"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo +nightly build -Z build-std=std,panic_abort --target x86_64-pc-windows-msvc --release --locked

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Windows81-VLC
          path: target/x86_64-pc-windows-msvc/release/moviebox-tui.exe
          if-no-files-found: error
